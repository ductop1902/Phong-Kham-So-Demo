const DAY0=8*60, DAY1=19*60, SLOT=30, SLOTPX=matchMedia('(max-width:820px)').matches?48:44;
function vLich(){
  const appts=D.appts.filter(a=>a.date===UI.calDate&&(!a.walkin||(a.cid&&['kham','xong'].includes(a.status))));
  const walk=D.appts.filter(a=>a.date===UI.calDate&&a.walkin&&['den','kham'].includes(a.status)).sort((a,b)=>(a.arrivedAt||'').localeCompare(b.arrivedAt||''));
  const by=UI.calBy==='bs'?'bs':'ghe', RES=by==='ghe'?CHAIRS:DOCTORS, key=by==='ghe'?'cid':'did';
  const sel=UI.calRes&&RES.some(r=>r.id===UI.calRes)?UI.calRes:RES[0].id;
  const narrow=matchMedia('(max-width:820px)').matches, COLS=narrow?RES.filter(r=>r.id===sel):RES;
  const editable=can.editAppt();
  const times=[];for(let m=DAY0;m<DAY1;m+=SLOT)times.push(`<div>${m%60||(UI.calDate===TODAY&&Math.abs(m-nowMin())<14)?'':hm(m)}</div>`);
  const sub=a=>by==='ghe'?docName(a.did).replace('BS. ',''):chairName(a.cid);
  const cols=COLS.map(r=>`<div class="col" data-by="${by}" data-k="${r.id}" style="height:${(DAY1-DAY0)/SLOT*SLOTPX}px">${nowLine()}${appts.filter(a=>a[key]===r.id).map(a=>{const p=P(a.pid);return `<button type="button" class="appt s-${a.status}${a.status==='huy'?' huy':''}" data-act="appt" data-id="${a.id}" ${editable&&!['xong','kham','huy'].includes(a.status)?'draggable="true"':''} style="top:${(a.start-DAY0)/SLOT*SLOTPX+1}px;height:${Math.max(a.dur/SLOT*SLOTPX-3,26)}px"><b>${hm(a.start)} ${esc(p.name)}${algTag(p,1)}</b><span>${svc(a.sid).name}, ${sub(a)}</span>${a.note&&!a.walkin?`<i class="ap-note">${esc(a.note)}</i>`:''}</button>`}).join('')}</div>`).join('');
  const walkBox=walk.length?`<section class="panel walkpanel" style="gap:8px"><header><h3>Hàng chờ vãng lai</h3><small>Không xếp vào lịch để tránh chồng giờ. Bác sĩ gọi khách nào thì khách đó mới nhận ghế còn trống.</small></header><div class="walkq">${walk.map(a=>`<button class="chip" data-act="appt" data-id="${a.id}"><b>${esc(P(a.pid).name)}</b>, đến ${a.arrivedAt}, ${docName(a.did).replace('BS. ','')}${a.status==='kham'?', đang khám '+(a.cid?chairName(a.cid):''):''}</button>`).join('')||'<span class="empty">Không có khách vãng lai đang chờ.</span>'}</div></section>`:'';
  const legendBox=`<details class="legend-box"${narrow?'':' open'}><summary>Chú giải màu</summary><div class="legend">${Object.keys(ST).map(pill).join('')}<span style="font-size:12px;color:var(--muted);align-self:center">Tô vàng là khách đang ở phòng khám. Chữ nâu cam là chưa gọi xác nhận. Nhãn đỏ là dị ứng. Gạch ngang là hủy hoặc không đến. Vạch mận là giờ hiện tại.</span></div></details>`;
  const head=r=>by==='ghe'?`${r.name}<small>${r.note}</small>`:`${r.name}<small>${appts.filter(a=>a.did===r.id&&a.status!=='huy').length} lịch</small>`;
  return `<div class="head"><div><h2>Lịch hẹn</h2><p>${dayLabel(UI.calDate)}, ${appts.filter(a=>a.status!=='huy').length} lịch.<span class="hint"> ${editable?`Bấm vào ô trống để đặt lịch, kéo thả để đổi giờ hoặc đổi ${by==='ghe'?'ghế':'bác sĩ'}.`:'Chỉ xem.'}</span></p></div>
  <div class="cal-tools"><div class="seg" role="group" aria-label="Xem lịch theo"><button class="btn sm" data-act="cal-by" data-by="ghe" aria-pressed="${by==='ghe'}">Theo ghế</button><button class="btn sm" data-act="cal-by" data-by="bs" aria-pressed="${by==='bs'}">Theo bác sĩ</button></div><button class="btn sm" data-act="cal-day" data-n="-1" aria-label="Ngày trước">‹</button><button class="btn sm" data-act="cal-today">Hôm nay</button><button class="btn sm" data-act="cal-day" data-n="1" aria-label="Ngày sau">›</button>${editable?'<button class="btn primary" data-act="new-appt">+ Thêm lịch</button>':''}</div></div>
  ${narrow?'':walkBox+legendBox}  <div class="scroll"><div class="chips docpick">${RES.map(r=>`<button type="button" class="chip" data-act="cal-res" data-k="${r.id}" aria-pressed="${sel===r.id}">${r.name.replace('BS. ','')}</button>`).join('')}</div>
  <div class="cal" style="--cols:${COLS.length};--slot:${SLOTPX}px;${narrow?'min-width:0':''}"><div class="ch"></div>${COLS.map(r=>`<div class="ch">${head(r)}</div>`).join('')}<div class="times">${times.join('')}${nowLbl()}</div>${cols}</div></div>${narrow?walkBox+legendBox:''}
  <p style="font-size:13px;color:var(--muted);margin:0">Ghế và bác sĩ được xếp riêng: một bác sĩ có thể làm ở nhiều ghế trong ngày, mỗi ghế chỉ nhận một khách cùng lúc. Nhắc hẹn tự động qua Zalo trước 1 ngày và 2 giờ <span class="notlive">Chưa kết nối Zalo thật</span></p>`;
}
function nowLine(){if(UI.calDate!==TODAY)return '';const m=nowMin();if(m<DAY0||m>DAY1)return '';return `<div class="nowline" style="top:${(m-DAY0)/SLOT*SLOTPX}px"></div>`}
function nowLbl(){if(UI.calDate!==TODAY)return '';const m=nowMin();if(m<DAY0||m>DAY1)return '';return `<span class="nowlbl" style="top:${(m-DAY0)/SLOT*SLOTPX}px">${hm(m)}</span>`}
setInterval(()=>{const m=nowMin();document.querySelectorAll('.nowline,.nowlbl').forEach(l=>{l.style.top=((m-DAY0)/SLOT*SLOTPX)+'px'});document.querySelectorAll('.nowlbl').forEach(l=>l.textContent=hm(m))},60000);
function conflict(did,date,start,dur,ignoreId){return D.appts.find(a=>a.id!==ignoreId&&(!a.walkin||(a.status==='kham'&&a.cid))&&a.did===did&&a.date===date&&!['huy','khongden','xong'].includes(a.status)&&start<a.start+a.dur&&a.start<start+dur)}
function chairConflict(cid,date,start,dur,ignoreId){return D.appts.find(a=>a.id!==ignoreId&&(!a.walkin||(a.status==='kham'&&a.cid))&&a.cid===cid&&a.date===date&&!['huy','khongden','xong'].includes(a.status)&&start<a.start+a.dur&&a.start<start+dur)}
function freeChair(date,start,dur,prefer){const order=[prefer,...CHAIRS.map(c=>c.id)].filter(Boolean);return order.find(c=>!chairConflict(c,date,start,dur))||null}
function freeSlotChair(did,date,dur,from){for(let m=Math.max(from||540,DAY0);m+dur<=DAY1;m+=15){if(conflict(did,date,m,dur))continue;const c=freeChair(date,m,dur,HOME_CHAIR[did]);if(c)return {start:m,cid:c}}return null}
function freeSlot(did,date,dur,from){for(let m=Math.max(from||540,DAY0);m+dur<=DAY1;m+=15){if(!conflict(did,date,m,dur))return m}return null}

/* ---------- Khách hàng ---------- */
function vKhach(){
  const list=D.patients.filter(p=>!p.deleted).sort((a,b)=>(b.history[0]?.date||'').localeCompare(a.history[0]?.date||''));
  return `<div class="head"><div><h2>Khách hàng</h2><p>${D.patients.length} hồ sơ mẫu, tìm nhanh ở ô trên cùng</p></div><div class="actions">${can.editPatient()?'<button class="btn primary" data-act="new-p">+ Khách mới</button>':''}</div></div>
  <section class="panel"><div class="scroll"><table class="t"><thead><tr><th>Khách</th><th>Điện thoại</th><th>Lần gần nhất</th><th>Nguồn</th><th class="num">Công nợ</th></tr></thead><tbody>
  ${list.map(p=>{const debt=D.bills.filter(b=>b.pid===p.id).reduce((t,b)=>t+remain(b),0);return `<tr><td><button class="link" data-act="open-p" data-id="${p.id}">${esc(p.name)}</button>${algTag(p)}<div style="font-size:12px;color:var(--muted)">${p.code}, ${p.group}</div></td><td>${p.phone}</td><td>${p.history[0]?vnDate(p.history[0].date):'Chưa khám'}</td><td>${p.source}</td><td class="num">${debt?`<b style="color:var(--danger)">${money(debt)}</b>`:'<span class="nil" aria-label="Không nợ">–</span>'}</td></tr>`}).join('')}
  </tbody></table></div></section>`;
}
/* Sơ đồ răng vẽ theo loại răng: cửa, nanh, hàm nhỏ, hàm lớn. Việc cần làm ghi đỏ, việc đã làm ghi mực. */
const TTYPE=n=>{const k=n%10;return k<=2?'inc':k===3?'can':k<=5?'pre':'mol'};
const SH={
  inc:{crown:'M10 56 L30 56 L32 87 Q20 92 8 87 Z',roots:['M11 56 Q13 20 20 8 Q27 20 29 56 Z'],canal:['M20 53 L20 16']},
  can:{crown:'M9 56 L31 56 L32 77 L20 93 L8 77 Z',roots:['M11 56 Q13 14 20 2 Q27 14 29 56 Z'],canal:['M20 53 L20 9']},
  pre:{crown:'M7 56 L33 56 Q36 76 31 88 Q25 92 20 88 Q15 92 9 88 Q4 76 7 56 Z',roots:['M10 56 Q12 22 20 12 Q28 22 30 56 Z'],canal:['M20 53 L20 19']},
  mol:{crown:'M4 56 L36 56 Q39 76 35 89 Q30 93 26 89 Q20 93 14 89 Q10 93 5 89 Q1 76 4 56 Z',roots:['M6 56 Q5 30 11 15 Q17 30 18 56 Z','M22 56 Q23 30 29 15 Q35 30 34 56 Z'],canal:['M12 53 L11.5 22','M28 53 L28.5 22']}
};
function toothSVG(n,s,lower){
  const sh=SH[TTYPE(n)],red=s==='nho',gone=s==='mat',dash=gone?' stroke-dasharray="3 3"':'',sc=red?' class="tp tsr"':' class="tp"';
  const roots=s==='implant'
    ?`<rect class="tp" x="15" y="12" width="10" height="44" rx="2" stroke="currentColor" stroke-width="1.6"/>${[20,28,36,44,52].map(y=>`<path d="M13 ${y} L27 ${y-4}" stroke="currentColor" stroke-width="1.4" fill="none"/>`).join('')}`
    :sh.roots.map(d=>`<path d="${d}"${sc} stroke="${red?'':'currentColor'}" stroke-width="1.6"${dash}/>`).join('');
  const crown=`<path d="${sh.crown}" class="${s==='su'?'tp2':'tp'}${red?' tsr':''}" stroke="${red?'':'currentColor'}" stroke-width="${s==='su'?3.4:1.6}"${dash}/>`;
  let mark='';
  if(s==='sau')mark='<circle class="tfr" cx="20" cy="74" r="5.5"/>';
  if(s==='tram')mark='<rect class="tfi" x="12" y="66" width="16" height="14" rx="3"/>';
  if(s==='tuy')mark=sh.canal.map(d=>`<path d="${d}" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>`).join('');
  if(s==='nho')mark='<path class="tsr" d="M5 92 L35 6" stroke-width="2.4" stroke-linecap="round" fill="none"/>';
  if(s==='mat')mark='<path d="M7 28 L33 88 M33 28 L7 88" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>';
  return `<svg viewBox="0 0 40 96" aria-hidden="true"><g${lower?' transform="translate(0 96) scale(1 -1)"':''}${gone?' opacity=".6"':''}>${roots}${crown}${mark}</g></svg>`;
}
/* Sơ đồ răng bản 4. Máy tính: cả hai hàm trên một hàng. Điện thoại: từng hàm phóng to, mỗi hàng 8 răng.
   Mặt răng: phần mềm, máy chủ và sơ đồ bản 4 cùng dùng T là mặt ngoài, L là mặt trong, truyền thẳng không đổi. */
function teethView(teeth,interactive,faces){
  const phone=matchMedia('(max-width:820px)').matches, mat={};
  if(faces)for(const n in faces){const s=teeth[n];if(faces[n]&&faces[n].length&&['sau','tram'].includes(s)){mat[n]={};faces[n].forEach(f=>mat[n][f]=s)}}
  const draw=z=>{const el=document.createElement('div');SoDoRang4.render(el,{rang:teeth,mat,boRang:'vinh',hamPhongTo:z,chon:interactive?UI.tsel:[],tuongTac:!!interactive});
    return el.innerHTML.replace(/<button type="button" class="sdr-th" data-rang="(\d+)" aria-pressed="(true|false)"/g,(m,n,p)=>interactive?`<button type="button" class="sdr-th${p==='true'?' sel':''}" data-act="tooth" data-n="${n}" data-rang="${n}" aria-pressed="${p}"`:`<button type="button" class="sdr-th" data-rang="${n}" aria-pressed="false"`)};
  const sideL=s=>{let i=0;return s.replace(/<div class="sdr-jaw">/g,m=>`<div class="jside">${i++?'Bên trái khách':'Bên phải khách'}</div>`+m)};
  const chart=phone?`<div class="teeth4 ph"><div class="jl">Hàm trên</div>${sideL(draw('up'))}<div class="jl">Hàm dưới</div>${sideL(draw('lo'))}</div>`
    :`<div class="teeth4"><div class="sides"><span>Bên phải khách</span><span>Hàm trên</span><span>Bên trái khách</span></div>${draw('all')}<div class="sides"><span>Bên phải khách</span><span>Hàm dưới</span><span>Bên trái khách</span></div></div>`;
  return chart+`<div class="tlegend">${Object.entries(TSTATE).filter(([k])=>k!=='ok').map(([k,v])=>`<span>${SoDoRang4.toothSVG(16,k,null,false)}${v[0]}</span>`).join('')}</div>`;
}

  ${can.editHealth()?`<div class="actions"><button class="btn sm" data-act="add-health" data-k="allergies" data-id="${p.id}">+ Thêm dị ứng</button><button class="btn sm" data-act="add-health" data-k="conditions" data-id="${p.id}">+ Thêm bệnh nền</button></div>`:''}
  <div class="grid g2">
   <section class="panel"><header><h3>Sơ đồ răng</h3><small>Ký hiệu FDI</small></header>${can.seeClinical()?teethView(p.teeth,false):'<div class="empty">Vai trò của bạn không xem được thông tin điều trị.</div>'}</section>

    <div class="list">${appts.map(a=>`<div class="row"><span class="time">${hm(a.start)}</span><div class="main"><b>${vnDate(a.date)}</b><div>${svc(a.sid).name}, ${docName(a.did)}</div>${a.note&&!a.walkin?`<div class="ap-note">${esc(a.note)}</div>`:''}</div>${pill(a.status)}</div>`).join('')||'<div class="empty">Chưa có lịch hẹn sắp tới.</div>'}</div>
    ${p.recallDue?`<div class="alert ${p.recallDue<TODAY?'amber':'grey'}">Hẹn tái khám ${vnDate(p.recallDue)}: ${esc(p.recallReason)}</div>`:''}
    <dl class="kv"><dt>Đồng ý xử lý dữ liệu</dt><dd>${vnDate(p.consentData.at)}, ${esc(p.consentData.how)}</dd><dt>Đồng ý nhận tin nhắc</dt><dd>${p.consentMsg?'Có':'Chưa đồng ý, không gửi tin tự động'}</dd><dt>Địa chỉ</dt><dd>${p.address?esc(p.address):'<span style="color:var(--danger)">Chưa có, cần để kê đơn</span>'}</dd>${p.guardian?`<dt>Người giám hộ</dt><dd>${esc(p.guardian)}</dd>`:''}<dt>Mã định danh công dân</dt><dd>${showId(p.cccd)}</dd></dl></section>
  </div>
  <div class="grid g2">
   <section class="panel"><header><h3>Lịch sử điều trị</h3><small>${p.history.length} lần</small></header>${can.seeClinical()?`<div class="list">${p.history.map(h=>`<div class="row"><div class="main"><b>${vnDate(h.date)}</b>, ${docName(h.doctor)}<div>${esc(h.services.join(', '))}${h.dx&&h.dx.length?`, ${(Array.isArray(h.dx)?h.dx:[h.dx]).map(c=>c+' '+((ICD.find(i=>i[0]===c)||[])[1]||'')).join('; ')}`:''}</div>${h.note?`<div>${esc(h.note)}</div>`:''}</div></div>`).join('')||'<div class="empty">Chưa có lần điều trị nào.</div>'}</div>`:`<div class="empty">${p.history.length} lần điều trị. Chi tiết chỉ bác sĩ, tư vấn và chủ phòng khám xem được.</div>`}
   ${p.plan.length?`<div class="alert grey">Đã tư vấn, chưa làm: ${p.plan.map(it=>svc(it.sid).name+(it.tooth?' răng '+it.tooth:'')).join(', ')}</div>`:''}</section>
   <section class="panel"><header><h3>Thanh toán</h3><small>Công nợ ${money(debt)}</small></header>
    <div class="list">${bills.map(b=>`<div class="row"><div class="main"><b>${vnDate(b.date)}</b>, ${money(b.total-b.discount)}<div>${esc(b.items.map(i=>i.name).join(', '))}</div></div>${b.status==='cho'?'<span class="pill plain">Chờ thanh toán</span>':remain(b)>0?`<span class="pill red">Còn nợ ${money(remain(b))}</span>${can.collect()?`<button class="btn sm" data-act="open-bill" data-id="${b.id}">Thu nợ</button>`:''}`:'<span class="pill ok">Đã trả đủ</span>'}</div>`).join('')||'<div class="empty">Chưa có hóa đơn.</div>'}</div>
    ${can.seeClinical()?`<h3 style="margin-top:6px">Đơn thuốc</h3><div class="list">${rxRows(D.rx.filter(r=>r.pid===p.id).slice().reverse())}</div>`:''}</section>

  <section class="panel"><header><h3>Nhật ký truy cập hồ sơ</h3><small>Mọi lần xem hoặc sửa đều được ghi lại</small></header><div class="scroll"><table class="t"><thead><tr><th>Giờ</th><th>Người</th><th>Việc</th></tr></thead><tbody>${logs.map(x=>`<tr><td>${vnDate(x.date)} ${x.at}</td><td>${esc(x.user)} (${x.role})</td><td>${esc(x.action)}</td></tr>`).join('')}</tbody></table></div></section>`;
}

/* ---------- Khám và điều trị ---------- */
function examOf(id){if(!D.exams[id]){const a=A(id),p=P(a.pid);D.exams[id]={reason:a.sid==='kham'?'':svc(a.sid).name,findings:'',dx:[],plan:p.plan.map(it=>({tooth:it.tooth,sid:it.sid,now:false})),teeth:Object.assign({},p.teeth),note:''}}if(!D.exams[id].rx)D.exams[id].rx={lines:[],override:''};return D.exams[id]}
function sendRx(rx){const p=P(rx.pid),t=clock();
  if(D.offline){rx.status='chogui';rx.error='';rx.log.unshift(t+' Mất mạng: đơn nằm trong hàng đợi, sẽ tự gửi khi có mạng');return}
  const errs=rxMissing(p,rx.dx,rx.weight).map(m=>'Thiếu '+m.label+' ('+m.f+')');
  if(errs.length){rx.status='guiloi';rx.error=errs.join('; ');rx.log.unshift(t+' Gửi lỗi (giả lập): '+rx.error)}else{rx.status='dagui';rx.error='';rx.log.unshift(t+' Gửi thành công (giả lập), nhận mã đơn '+rx.code)}}
/* Trường bắt buộc theo đặc tả Đơn thuốc quốc gia (Quyết định 808, bản tải ở donthuocquocgia.vn): họ tên, ngày sinh, giới tính, địa chỉ, chẩn đoán; trẻ dưới 72 tháng thêm thông tin người giám hộ. Mã định danh công dân, cân nặng, số điện thoại là không bắt buộc. */
const monthsOld=dob=>{if(!dob)return null;const d=new Date(dob+'T00:00:00'),n=new Date();let m=(n.getFullYear()-d.getFullYear())*12+n.getMonth()-d.getMonth();if(n.getDate()<d.getDate())m--;return m};
function rxMissing(p,dx,weight){const m=[];
  if(!String(p.name||'').trim())m.push({f:'ho_ten_benh_nhan',label:'họ tên'});
  if(!p.dob)m.push({f:'ngay_sinh_benh_nhan',label:'ngày sinh'});
  if(!p.gender)m.push({f:'gioi_tinh',label:'giới tính'});
  if(!String(p.address||'').trim())m.push({f:'dia_chi',label:'địa chỉ'});
  if(!dx||!dx.length)m.push({f:'chan_doan',label:'chẩn đoán'});
  const mo=monthsOld(p.dob);if(mo!=null&&mo<72){if(!String(p.guardian||'').trim())m.push({f:'thong_tin_nguoi_giam_ho',label:'họ tên người đưa trẻ đi khám (trẻ dưới 72 tháng)'});if(!(+weight>0))m.push({f:'can_nang',label:'cân nặng (trẻ dưới 72 tháng, bác sĩ cân khi khám)'})}
  return m}
function rxRows(list){return list.map(r=>{const p=P(r.pid);return `<div class="row"><div class="main"><button class="link" data-act="rx-view" data-id="${r.id}">${r.code}</button>, ${esc(p.name)}<div>${vnDate(r.date)} ${r.at}, ${docName(r.did)}, ${r.lines.map(l=>drug(l.drug).name).join(', ')}</div>${r.error?`<div style="color:var(--danger)">${esc(r.error)}</div>`:''}</div>${rxPill(r)}${['guiloi','chogui'].includes(r.status)&&UI.role==='bacsi'?`<button class="btn sm" data-act="rx-resend" data-id="${r.id}">Gửi lại</button>`:''}</div>`}).join('')||'<div class="empty">Chưa có đơn thuốc.</div>'}
function rxAlert(){const n=D.rx.filter(r=>['guiloi','chogui'].includes(r.status)&&(UI.role!=='bacsi'||r.did===me().did)).length;return n?`<div class="alert red">${n} đơn thuốc chưa gửi được lên hệ thống. <button class="link" data-act="nav" data-v="kham">Xem và gửi lại</button></div>`:''}
const inp='padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface)';

   <div class="tp-head"><b>Răng ${UI.tsel.join(', ')}${one?`<span class="tp-now">đang ghi: ${TSTATE[e.teeth[one]||'ok'][0]}</span>`:''}</b><button type="button" class="btn primary" data-act="tdone">Xong</button></div>
   <div class="tp-row"><span class="tp-lbl">Tình trạng</span><div class="chips tp-big">${Object.entries(TSTATE).map(([k,v])=>`<button type="button" class="chip" data-act="tstate" data-s="${k}" aria-pressed="${UI.tsel.every(n=>(e.teeth[n]||'ok')===k)}">${v[0]}</button>`).join('')}</div></div>

   <p class="tp-dx">Chẩn đoán: ${e.dx.length?e.dx.join(', '):'chưa chọn'}. Chọn ở mục Chẩn đoán trong Phiếu khám.</p>
   <div class="tp-row"><span class="tp-lbl">Dịch vụ</span><div class="chips tp-big">${tsv.map(s=>`<button type="button" class="chip" data-act="tsvc" data-s="${s.id}" aria-pressed="${UI.tsel.every(n=>e.plan.some(it=>it.tooth===n&&it.sid===s.id))}">${s.name}, ${money(s.price)}</button>`).join('')}</div></div>

function rxTplBox(p,e){const T=tpls();
  return `<div class="tp-row"><span class="tp-lbl">Đơn thuốc mẫu</span><div class="chips tp-big">${T.map(t=>t.ok?`<button type="button" class="chip" data-act="rxtpl" data-id="${t.id}">${esc(t.name)}</button>`:`<span class="chip tpl-wait">${esc(t.name)}: chờ Chuyên môn duyệt${isCM()?` <button type="button" class="link" data-act="rxtpl-view" data-id="${t.id}">Xem và duyệt</button>`:''}</span>`).join('')}</div></div>

function addPlanSvc(e,s){
  if(s.tooth&&!UI.tsel.length){toast('Dịch vụ này tính theo răng. Chọn răng trên sơ đồ trước.',true);return false}
  const bad=s.tooth&&['tram','tuy','su','nho'].includes(s.id)&&UI.tsel.find(n=>['mat','implant'].includes(e.teeth[n]));if(bad){toast(`Răng ${bad} đang ghi ${TSTATE[e.teeth[bad]][0]}, không thêm ${s.name.toLowerCase()} được`,true);return false}
  const nowDef=s.price<4000000;
  if(s.tooth)UI.tsel.forEach(n=>{if(!e.plan.some(it=>it.tooth===n&&it.sid===s.id))e.plan.push({tooth:n,sid:s.id,now:nowDef})});else if(!e.plan.some(it=>!it.tooth&&it.sid===s.id))e.plan.push({tooth:null,sid:s.id,now:nowDef});
  if(!nowDef)toast('Dịch vụ lớn được để trong kế hoạch. Tích Làm hôm nay nếu làm ngay.');return true}
function addRxLines(p,e,lines){let n=0,warn='';
  lines.forEach(l=>{if(e.rx.lines.some(x=>x.drug===l.drug))return;e.rx.lines.push({drug:l.drug,qty:l.qty,usage:l.usage});n++;
    const h=allergyHit(p,drug(l.drug));if(h&&!warn)warn='Cảnh báo dị ứng: khách đã khai '+h;else if(!warn&&pregState(p,e)==='co'&&PREG_WARN[l.drug])warn='Cảnh báo mang thai: '+PREG_WARN[l.drug]});
  return {n,warn}}
function rxPanel(p,e){
  const hits=e.rx.lines.map(l=>allergyHit(p,drug(l.drug)));
  const ps=pregState(p,e), pregHits=e.rx.lines.map(l=>ps==='co'?PREG_WARN[l.drug]||null:null);

/* Giảm giá: chỉ lưu khi bấm Xác nhận, có lý do, ghi nhật ký; mức lớn cần chủ phòng khám duyệt */
function discountBox(b){const r=b.discReq;
  if(r)return `<div class="alert amber" style="flex-wrap:wrap;align-items:center"><span style="flex:1 1 240px">Đang chờ chủ phòng khám duyệt giảm ${money(r.amount)}. Lý do: ${esc(r.reason)}. Người đề nghị: ${esc(r.by)} lúc ${r.at}.</span><span class="actions">${can.approveDiscount()?`<button class="btn sm primary" data-act="disc-approve" data-id="${b.id}">Duyệt</button><button class="btn sm" data-act="disc-reject" data-id="${b.id}">Từ chối</button>`:`<button class="btn sm" data-act="disc-cancel" data-id="${b.id}">Hủy đề nghị</button>`}</span></div>`;
  return `<div class="grid g2" style="gap:12px;align-items:end"><label class="f">Giảm giá (đồng)<input id="b-disc" type="number" min="0" step="10000" value="${UI.discDraft&&UI.discDraft.id===b.id?UI.discDraft.v:b.discount}"></label><label class="f">Lý do giảm<input id="b-disc-why" placeholder="Ví dụ: khách thân thiết" value="${esc(UI.discDraft&&UI.discDraft.id===b.id?UI.discDraft.why:'')}"></label></div>
   <div class="actions" style="align-items:center"><button class="btn" data-act="disc-ok" data-id="${b.id}">Xác nhận giảm giá</button><span id="disc-prev" style="font-size:13px;color:var(--muted)">${b.discount?'Đang áp dụng giảm '+money(b.discount):'Chưa giảm giá'}. Giảm trên ${money(DCFG().amt)} hoặc trên ${DCFG().pct}% hóa đơn cần chủ phòng khám duyệt.</span></div>`}
function billRow(b){const p=P(b.pid);return `<div class="row"><div class="main"><div class="nm"><button class="link pn" data-act="open-bill" data-id="${b.id}">${esc(p.name)}</button>${algTag(p)}</div><div class="sub">${nw(esc(b.items.map(i=>i.name).join(', ')))}, ${nw(docName(b.did))}</div></div>${can.collect()?`<b class="amt">${money(b.total-b.discount-b.paid)}</b>`:''}${can.collect()?`<button class="btn sm primary" data-act="open-bill" data-id="${b.id}">Thu tiền</button>`:''}</div>`}
const METHOD={tienmat:'Tiền mặt',chuyenkhoan:'Chuyển khoản',the:'Thẻ'};

function searchP(q){q=norm(q).trim();if(!q)return[];const digits=q.replace(/\D/g,'');
  return D.patients.filter(p=>!p.deleted).filter(p=>(digits.length>=3&&p.phone.endsWith(digits))||(q.replace(/\d/g,'').trim().length>=2&&norm(p.name).includes(q))||norm(p.code)===q).slice(0,8)}
function resultsHTML(list,act){return list.length?list.map(p=>`<button type="button" data-act="${act}" data-id="${p.id}"><span><b>${esc(p.name)}</b> <small style="color:var(--muted)">${p.code}</small>${algTag(p,1)}</span><span style="color:var(--muted)">···${p.phone.slice(-4)}</span></button>`).join(''):'<div class="none">Không thấy khách. Kiểm tra lại hoặc tạo khách mới.</div>'}
$('#q').addEventListener('input',e=>{const v=e.target.value,box=$('#results');if(!v.trim()){box.hidden=true;return}box.innerHTML=resultsHTML(searchP(v),'pick-search')+(can.editPatient()?`<button type="button" data-act="new-p"><span>+ Tạo khách mới</span></button>`:'');box.hidden=false});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){const r=searchP(e.target.value);if(r.length===1){e.preventDefault();pickSearch(r[0].id)}}if(e.key==='Escape'){$('#results').hidden=true}});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('#results').hidden=true});
function pickSearch(id){$('#q').value='';$('#results').hidden=true;go('hoso',{pid:id})}

function startExam(id){const a=A(id);if(UI.role!=='bacsi'){toast('Chỉ bác sĩ được khám',true);return}
  D.appts.forEach(x=>{if(x.did===a.did&&x.status==='kham'&&x.id!==id)x.status='den'});a.status='kham';if(a.walkin&&!a.cid){const m=nowMin();a.start=m;a.dur=30;a.cid=freeChair(TODAY,m,30,HOME_CHAIR[a.did]);audit(a.pid,'Khách vãng lai vào '+(a.cid?chairName(a.cid):'ghế còn trống khi gọi')) }examOf(id);UI.tsel=[];audit(a.pid,'Mở phiếu khám');closeModal();go('kham',{apptId:id})}
function finishExam(id){
  const a=A(id);if(!a||a.status!=='kham'){toast('Phiếu khám này đã ký rồi',true);return}
  const p=P(a.pid),e=examOf(id),now=e.plan.filter(it=>it.now),later=e.plan.filter(it=>!it.now);
  const bad=e.rx.lines.find(l=>!(+l.qty>0)||!String(l.usage).trim());if(bad){toast('Đơn thuốc: ghi đủ số lượng và cách dùng cho '+drug(bad.drug).name,true);return}
  if(e.rx.lines.length){const miss=rxMissing(p,e.dx,e.weight);if(miss.length){toast('Đơn thuốc còn thiếu '+miss.map(m=>m.label).join(', ')+'. Bấm Bổ sung ngay ở phần Kê đơn.',true);return}
    if(childbearing(p)&&!pregFromRecord(p)&&!e.preg){toast('Hỏi và ghi tình trạng mang thai của khách trước khi ký đơn',true);return}
    const ps=pregState(p,e);const warn=e.rx.lines.some(l=>allergyHit(p,drug(l.drug))||(ps==='co'&&PREG_WARN[l.drug]));
    if(warn&&!e.rx.override.trim()){toast('Ghi lý do vẫn kê thuốc có cảnh báo trước khi ký',true);return}}

document.addEventListener('dragover',e=>{const c=e.target.closest('.cal .col');if(c&&dragId){e.preventDefault();document.querySelectorAll('.cal .col.over').forEach(x=>x!==c&&x.classList.remove('over'));c.classList.add('over')}});
document.addEventListener('dragleave',e=>{const c=e.target.closest('.cal .col');if(c&&!c.contains(e.relatedTarget))c.classList.remove('over')});
document.addEventListener('drop',e=>{const c=e.target.closest('.cal .col');if(!c||!dragId)return;e.preventDefault();c.classList.remove('over');
  const a=A(dragId);dragId=null;const y=e.clientY-c.getBoundingClientRect().top;let start=DAY0+Math.round(y/SLOTPX*SLOT/15)*15;start=Math.max(DAY0,Math.min(start,DAY1-a.dur));
  const did=c.dataset.by==='bs'?c.dataset.k:a.did, cid=c.dataset.by==='ghe'?c.dataset.k:a.cid;
  const cf=conflict(did,a.date,start,a.dur,a.id);if(cf){toast(`Không đổi được: ${docName(did)} đã có lịch ${P(cf.pid).name} lúc ${hm(cf.start)}`,true);return}
  const cc=chairConflict(cid,a.date,start,a.dur,a.id);if(cc){toast(`Không đổi được: ${chairName(cid)} đã có khách ${P(cc.pid).name} lúc ${hm(cc.start)}`,true);return}
  a.start=start;a.did=did;a.cid=cid;audit(a.pid,`Đổi lịch sang ${hm(start)}, ${docName(did)}, ${chairName(cid)}`);toast(`Đã đổi sang ${hm(start)}, ${docName(did)}, ${chairName(cid)}`);render()});
document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.cal .col.over').forEach(x=>x.classList.remove('over'))});
/* Bấm ô trống để đặt lịch */
document.addEventListener('dblclick',()=>{});
document.addEventListener('click',e=>{const c=e.target.closest('.cal .col');if(!c||e.target.closest('.appt')||!can.editAppt())return;
  const y=e.clientY-c.getBoundingClientRect().top;const start=DAY0+Math.floor(y/SLOTPX)*SLOT;apptForm(c.dataset.by==='bs'?{did:c.dataset.k,date:UI.calDate,start}:{cid:c.dataset.k,did:Object.keys(HOME_CHAIR).find(k=>HOME_CHAIR[k]===c.dataset.k),date:UI.calDate,start})});

load();render();
(()=>{const h=$('header.top'),n=$('nav.side');const f=()=>{document.documentElement.style.setProperty('--hh',h.offsetHeight+'px');document.documentElement.style.setProperty('--nh',n.offsetHeight+'px')};f();try{new ResizeObserver(f).observe(h);new ResizeObserver(f).observe(n)}catch(_){addEventListener('resize',f)}})();
if(SIMAUTO)setTimeout(()=>toast('Đang ngoài giờ làm việc nên bản chạy thử xem như lúc 09:45. Đổi ở mục Giờ thử.'),300);
/* Thu gọn đầu trang khi cuộn xuống trên điện thoại; mở lại khi cuộn lên rõ ràng hoặc về đầu trang */
let lastY=0,upAcc=0;addEventListener('scroll',()=>{const y=scrollY,h=$('header.top');if(!h)return;const d=y-lastY;lastY=y;
  const col=on=>{if(h.classList.contains('collapsed')===on)return;const a=h.offsetHeight;h.classList.toggle('collapsed',on);h.style.marginBottom=on?(a-h.offsetHeight)+'px':''};
  if(y<20){col(false);upAcc=0;return}
  if(d>0){upAcc=0;if(y>120)col(true)}else{upAcc-=d;if(upAcc>60)col(false)}},{passive:true});
try{matchMedia('(max-width:820px)').addEventListener('change',()=>{if(UI.view==='lich')render()})}catch(_){}
})();
